# LandingPage — Retired Island Tombstones (EPIC-SMR · SMR-13, DoD-SMR-13-02)
#
# G-Set retirement, not deletion. Each entry is an append-only tombstone: the
# island's capability moved to `mcard-studio`, so the name is retired from the
# active surface while the artifact itself is preserved. Nothing here is removed;
# a tombstone records *why* a name is no longer the place to build on.
#
# `load_bearing` is the honest part of this record: a retirement is not a claim
# that the artifact is already unused. `true` means the file is still imported or
# linked by live code today, so it cannot be removed without a coordinated change
# to its dependents. The gate reports these rather than pretending they are gone.

version: 1
program: EPIC-SMR
sprint: SMR-13
