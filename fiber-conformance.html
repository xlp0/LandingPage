<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fiber Conformance Harness</title>
<style>
  :root { --tone-fg: #111; --tone-bg: #fff; --tone-border: #767676; }
  html[data-theme="dark"] { --tone-fg: #f2f2f2; --tone-bg: #101014; --tone-border: #9a9aa2; }
  html[data-theme="high-contrast"] { --tone-fg: #000; --tone-bg: #fff; --tone-border: #000; }
  body { margin: 0; background: var(--tone-bg); color: var(--tone-fg);
         font: 16px/1.5 system-ui, sans-serif; }
  #harness { padding: 12px; }
  .fiber { border: 1px solid var(--tone-border); border-radius: 6px; padding: 8px;
           max-width: 100%; overflow-wrap: anywhere; }
  .fiber-code, .fiber-json, .fiber-hex { font-family: ui-monospace, monospace;
           white-space: pre-wrap; }
  /* energy-saving mode zeroes motion, as the unit manifest requires */
  html[data-power="energy_saving"] * { animation: none !important; transition: none !important; }
</style>
</head>
<body>
<div id="harness" role="main"></div>

<script>
  // Bare specifiers must resolve before the module below is evaluated.
  const { protocol, hostname, port } = window.location;
  const base = `${protocol}//${hostname}${port && port !== '80' && port !== '443' ? ':' + port : ''}`;
  const map = document.createElement('script');
  map.type = 'importmap';
  map.textContent = JSON.stringify({
    imports: { 'clm-kernel': `${base}/public/js/vendor/clm-kernel.bundle.js` },
  });
  document.currentScript.parentNode.insertBefore(map, document.currentScript.nextSibling);
</script>

<script type="module">
/**
 * The conformance harness page.
 *
 * Renders exactly one fiber for one lattice coordinate, driven by query
 * parameters, so a real browser can measure a real laid-out surface. The
 * measurements themselves live in the spec: this page only mounts, because the
 * property under test is what the browser *lays out*, not what the adapter says
 * it would render.
 *
 * Grounding: arXiv:2608.25512 — sweeping the lattice is a context change, and a
 * fiber's activation is driven by its coeffect specification. Locale, direction,
 * display mode and power mode are applied to the document before the mount.
 *
 * Data comes from a pre-serialised bundle derived from the registry, so the page
 * carries no YAML parser and a fiber added by data alone still reaches it.
 */
import { FiberRegistry } from './public/js/fibers/registry.js';
import { MCard } from 'clm-kernel';
// Context and Service are re-exported by the bundle so the page needs one import map entry
import { Context, Service } from 'clm-kernel';

const q = new URLSearchParams(location.search);
const kind = q.get('kind') ?? 'text/plain';
const locale = q.get('locale') ?? 'en-US';
const dir = q.get('dir') ?? 'ltr';
const theme = q.get('display_mode') ?? 'light';
const power = q.get('power_mode') ?? 'performance';

document.documentElement.lang = locale;
document.documentElement.dir = dir;
document.documentElement.dataset.theme = theme;
document.documentElement.dataset.power = power;

function report(payload) {
  window.__FIBER_HARNESS__ = payload;
  document.body.dataset.harnessReady = 'true';
  let el = document.getElementById('harness-report');
  if (!el) {
    el = document.createElement('pre');
    el.id = 'harness-report';
    el.hidden = true;
    document.body.appendChild(el);
  }
  el.textContent = JSON.stringify(payload);
}

async function main() {
  const data = await fetch('./public/conformance/harness-data.json').then((r) => r.json());
  const entry = data.taxonomy.kinds.find((k) => k.kind === kind);
  if (!entry) return report({ status: 'unknown-kind', kind });

  const card = MCard.fromJSON(data.cards[kind]);

  const root = new Context();
  for (const name of ['highlighter', 'media', 'renderer']) {
    class Svc extends Service { constructor(ctx) { super(ctx, name); this.ready = true; } }
    root.plugin(Svc);
  }
  await new Promise((r) => setTimeout(r, 50));

  const registry = new FiberRegistry(data.registry, { ctx: root });
  const host = document.getElementById('harness');
  const { adapter, fallback, scope } = await registry.mountCard(card, host, kind);
  const descriptor = adapter.mount(card, host, scope, { fallback });

  report({
    status: 'mounted', kind, mode: descriptor.mode, fallback,
    locale, dir, theme, power,
    hostChildren: host.childElementCount,
    inverseCount: scope.inverseCount,
    declaredWidth: data.registry.fibers.find((f) => f.kind === kind)?.budget?.max_bytes ?? null,
  });
}

main().catch((e) => report({ status: 'error', error: String(e.message ?? e) }));
</script>
</body>
</html>
