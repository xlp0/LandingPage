name: Playwright Quality Preflight

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  discovery-and-unit-preflight:
    name: Discovery Guard and Unit Suite (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Playwright project discovery guard
        run: npm run check:playwright-discovery

      - name: Run unit test suite
        run: npm run test:unit
