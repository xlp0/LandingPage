name: CLM Test All Components

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'components/**/*.html'
      - 'archive/html/index-clm-dashboard.html'
      - 'tests/components/test-clm-*.spec.js'
      - 'tests/fixtures/**'
      - 'playwright.config.js'
      - '.github/workflows/clm-test-all-components.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'components/**/*.html'
      - 'archive/html/index-clm-dashboard.html'
      - 'tests/components/test-clm-*.spec.js'
      - 'tests/fixtures/**'
      - 'playwright.config.js'
      - '.github/workflows/clm-test-all-components.yml'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      run_all: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.shared }}
      welcome: ${{ steps.filter.outputs.welcome }}
      hero-content: ${{ steps.filter.outputs.hero-content }}
      p2p-status: ${{ steps.filter.outputs.p2p-status }}
      crash-test: ${{ steps.filter.outputs.crash-test }}
      wikipedia-viewer: ${{ steps.filter.outputs.wikipedia-viewer }}
      user-list: ${{ steps.filter.outputs.user-list }}
      user-detail: ${{ steps.filter.outputs.user-detail }}
      redux-state-viewer: ${{ steps.filter.outputs.redux-state-viewer }}
      wikipedia-search: ${{ steps.filter.outputs.wikipedia-search }}
      external-site-demo: ${{ steps.filter.outputs.external-site-demo }}
      google-maps: ${{ steps.filter.outputs.google-maps }}
      pkc-viewer: ${{ steps.filter.outputs.pkc-viewer }}
      grafana-faro: ${{ steps.filter.outputs.grafana-faro }}
      youtube-viewer: ${{ steps.filter.outputs.youtube-viewer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'archive/html/index-clm-dashboard.html'
              - 'tests/fixtures/**'
              - 'playwright.config.js'
              - '.github/workflows/clm-test-all-components.yml'
            welcome:
              - 'components/welcome.html'
              - 'tests/components/test-clm-welcome.spec.js'
            hero-content:
              - 'components/hero.html'
              - 'tests/components/test-clm-hero-content.spec.js'
            p2p-status:
              - 'components/p2p-status.html'
              - 'tests/components/test-clm-p2p-status.spec.js'
            crash-test:
              - 'components/crash-test.html'
              - 'tests/components/test-clm-crash-test.spec.js'
            wikipedia-viewer:
              - 'components/wikipedia-viewer.html'
              - 'tests/components/test-clm-wikipedia-viewer.spec.js'
            user-list:
              - 'components/user-list.html'
              - 'tests/components/test-clm-user-list.spec.js'
            user-detail:
              - 'components/user-detail.html'
              - 'tests/components/test-clm-user-detail.spec.js'
            redux-state-viewer:
              - 'components/redux-state-viewer.html'
              - 'tests/components/test-clm-redux-state-viewer.spec.js'
            wikipedia-search:
              - 'components/wikipedia-search.html'
              - 'tests/components/test-clm-wikipedia-search.spec.js'
            external-site-demo:
              - 'tests/components/test-clm-external-site-demo.spec.js'
            google-maps:
              - 'tests/components/test-clm-google-maps.spec.js'
            pkc-viewer:
              - 'components/pkc-viewer.html'
              - 'tests/components/test-clm-pkc-viewer.spec.js'
            grafana-faro:
              - 'components/grafana-faro.html'
              - 'tests/components/test-clm-grafana-faro.spec.js'
            youtube-viewer:
              - 'components/youtube-viewer.html'
              - 'tests/components/test-clm-youtube-viewer.spec.js'

  test-components:
    needs: detect-changes
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - hash: welcome
            name: Welcome Component
            changed: ${{ needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.welcome == 'true' }}
          - hash: hero-content
            name: Hero Content
            changed: ${{ needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.hero-content == 'true' }}
          - hash: p2p-status
            name: P2P Network Status
            changed: ${{ needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.p2p-status == 'true' }}
          - hash: crash-test
            name: Intentional Failure Component
            changed: ${{ needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.crash-test == 'true' }}
          - hash: wikipedia-viewer
            name: Wikipedia Article Viewer
            changed: ${{ needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.wikipedia-viewer == 'true' }}
          - hash: user-list
            name: User Account List
            changed: ${{ needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.user-list == 'true' }}
          - hash: user-detail
            name: User Account Detail
            changed: ${{ needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.user-detail == 'true' }}
          - hash: redux-state-viewer
            name: Redux State Viewer
            changed: ${{ needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.redux-state-viewer == 'true' }}
          - hash: wikipedia-search
            name: Wikipedia Search
            changed: ${{ needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.wikipedia-search == 'true' }}
          - hash: external-site-demo
            name: External Site Demo
            changed: ${{ needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.external-site-demo == 'true' }}
          - hash: google-maps
            name: Google Maps Demo
            changed: ${{ needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.google-maps == 'true' }}
          - hash: pkc-viewer
            name: PKC Document Viewer
            changed: ${{ needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.pkc-viewer == 'true' }}
          - hash: grafana-faro
            name: Grafana Faro Integration
            changed: ${{ needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.grafana-faro == 'true' }}
          - hash: youtube-viewer
            name: YouTube Video Viewer
            changed: ${{ needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.youtube-viewer == 'true' }}

    name: Test ${{ matrix.component.name }}

    steps:
      - uses: actions/checkout@v4
        if: ${{ matrix.component.changed == 'true' }}

      - name: Setup Node.js 24
        if: ${{ matrix.component.changed == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: ${{ matrix.component.changed == 'true' }}
        run: npm ci

      - name: Install Playwright Chromium
        if: ${{ matrix.component.changed == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Run Playwright component spec for ${{ matrix.component.name }}
        if: ${{ matrix.component.changed == 'true' }}
        id: test
        run: npx playwright test tests/components/test-clm-${{ matrix.component.hash }}.spec.js --project=components
        env:
          CI: '1'

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.component.changed == 'true' }}
        with:
          name: clm-${{ matrix.component.hash }}-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy-to-test:
    needs: test-components
    runs-on: ubuntu-latest
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    name: Deploy to test.pkc.pub
    steps:
      - uses: actions/checkout@v4

      - name: Trigger ArgoCD Sync
        run: |
          echo "### Deploying to test.pkc.pub" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ArgoCD syncs the cluster state from main." >> $GITHUB_STEP_SUMMARY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
