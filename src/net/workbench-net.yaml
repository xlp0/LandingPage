      initialTokens: 0
      description: Recoverable error state for GET /public/conformance/harness-data.json on fiber-conformance.html
    - id: p_pending_probe_handshake
      initialTokens: 0
      description: In-flight postMessage probe handshake state from p_page_responsive_lab
    - id: p_error_target_blocked
      initialTokens: 0
      description: Recoverable blocked-target policy state on responsive-lab.html
    - id: p_error_capture_unavailable
      initialTokens: 0
      description: Recoverable capture-unavailable policy state on responsive-lab.html
    - id: p_error_handshake_timeout
      initialTokens: 0
      description: Recoverable 5000ms probe handshake timeout state on responsive-lab.html
    - id: p_error_target_unapproved
      initialTokens: 0
      description: Recoverable unapproved or malformed custom target state on responsive-lab.html
