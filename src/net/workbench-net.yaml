      initialTokens: 1
      description: Workbench root entry route that redirects top-level requests to Responsive UI Lab
    - id: p_page_responsive_lab
      initialTokens: 0
      description: Primary P0 Responsive UI Lab full-window viewport workbench
    - id: p_page_app
      initialTokens: 0
      description: Legacy Mission Control MCard Manager host page
    - id: p_page_sprint_registry
      initialTokens: 0
      description: Internal CLM sprint registry catalog page
    - id: p_page_fiber_inspector
      initialTokens: 0
      description: Internal fiber correctness and marking inspector page
    - id: p_page_fiber_conformance
      initialTokens: 0
      description: Internal fiber conformance harness page
    - id: p_view_index_mcard_viewer
      initialTokens: 0
      description: Single-page 4-modality MCard viewer mode on index.html?noredirect=1
    - id: p_external_games
      initialTokens: 0
      description: External game popup windows launched from app.html via window.open
    - id: p_pending_get_app_config
      initialTokens: 0
      description: In-flight pending state for GET /app-config.json from p_page_responsive_lab
    - id: p_pending_post_test_runs
      initialTokens: 0
      description: In-flight pending state for POST /api/test-runs from p_page_responsive_lab
    - id: p_error_post_test_runs
      initialTokens: 0
      description: Recoverable error state for POST /api/test-runs on responsive-lab.html
    - id: p_pending_get_conformance_latest
      initialTokens: 0
      description: In-flight pending state for GET /api/test-runs/conformance/latest from p_page_responsive_lab
    - id: p_pending_get_env
      initialTokens: 0
      description: In-flight pending state for GET /api/env from p_view_index_mcard_viewer
    - id: p_pending_get_mcard_landing
      initialTokens: 0
      description: In-flight pending state for GET /api/mcard/landing from p_view_index_mcard_viewer
    - id: p_pending_put_mcard_landing
      initialTokens: 0
      description: In-flight pending state for PUT /api/mcard/landing from p_view_index_mcard_viewer
    - id: p_error_put_mcard_landing
      initialTokens: 0
      description: Recoverable error state for PUT /api/mcard/landing on index.html
    - id: p_pending_get_clm_program_artifact
      initialTokens: 0
      description: In-flight pending state for GET /api/clm/program-artifact from p_view_index_mcard_viewer
    - id: p_pending_get_clm_registry
      initialTokens: 0
      description: In-flight pending state for GET /api/clm/registry from p_page_sprint_registry
    - id: p_error_get_clm_registry
      initialTokens: 0
      description: Recoverable error state for GET /api/clm/registry on sprint-registry.html
    - id: p_pending_get_fiber_inspector_harness
      initialTokens: 0
      description: In-flight pending state for GET /public/conformance/harness-data.json from p_page_fiber_inspector
    - id: p_error_get_fiber_inspector_harness
      initialTokens: 0
      description: Recoverable error state for GET /public/conformance/harness-data.json on fiber-inspector.html
    - id: p_pending_get_fiber_conformance_harness
      initialTokens: 0
      description: In-flight pending state for GET /public/conformance/harness-data.json from p_page_fiber_conformance
