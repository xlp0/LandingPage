<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conformance Good Fixture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; padding: 1rem; max-width: 100%; overflow-x: hidden; }
    main { width: 100%; max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #111; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-width: 48px; min-height: 48px; padding: 0.5rem 1rem; margin: 0.5rem 0; font-size: 1rem; border-radius: 6px; border: 1px solid #ccc; background: #eee; cursor: pointer; }
    input[type="text"] { width: 100%; min-height: 44px; padding: 0.5rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1 data-testid="heading-main">Conformance Certified Surface</h1>
    <p>This fixture complies with all device invariants.</p>
    <button type="button" class="btn" data-testid="btn-action">Action (48x48)</button>
    <input type="text" data-testid="input-state" placeholder="State preservation input">
  </main>
</body>
</html>
